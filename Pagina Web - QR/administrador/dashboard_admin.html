<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Dashboard Administrador</title>

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.3/dist/darkly/bootstrap.min.css" rel="stylesheet">

<!--<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">-->

<style>
/* Oculta secciones */
.oculto{
    display: none;
}

/* Caja más bonita */
.caja{
    border-radius: 10px;
}
</style>

</head>

<body onload="listarUsuarios()">

<!-- NAVBAR -->
<nav class="navbar navbar-dark bg-dark">
    <div class="container">

        <!-- Título -->
        <h4 class="text-white">Panel de Administración</h4>

        <!-- Cerrar sesión -->
        <button onclick="window.location.href='../login.html'" class="btn btn-danger">
            Cerrar Sesión
        </button>
    </div>
</nav>

<!-- CONTENIDO -->
<div class="container mt-4">

    <!-- BOTONES -->
    <div class="text-center mb-4">
        <button class="btn btn-primary" onclick="mostrar('usuarios')">Usuarios</button>
        <button class="btn btn-success" onclick="mostrar('productos')">Productos</button>
        <button class="btn btn-warning" onclick="mostrar('ventas')">Ventas</button>
    </div>

    <!-- ================= USUARIOS ================= -->
    <div id="usuarios" class="card p-4 shadow caja">

        <h3>Gestión de Usuarios</h3>

        <!-- Botones -->
        <div class="mb-3">
            <a href="crear_usuario.html" class="btn btn-primary">Nuevo Usuario</a>
            <a href="usuarios.html" class="btn btn-success">Ver Reportes</a>
        </div>

        <!-- TABLA -->
        <table class="table table-striped text-center">
            <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Correo</th>
                    <th>Acciones</th>
                </tr>
            </thead>

            <tbody id="tablaUsuarios"></tbody>
        </table>

    </div>

    <!-- ================= PRODUCTOS ================= -->
    <div id="productos" class="card p-4 shadow caja oculto">

        <h3>Gestión de Productos</h3>

        <!-- Botones -->
        <div class="mb-3">
            <a href="" class="btn btn-primary">Nuevo productos</a>
            <a href="" class="btn btn-success">Ver Reportes</a>
        </div>

        <!-- TABLA -->
        <table class="table table-striped text-center">
            <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Nombre producto</th>
                    <th>cantidad</th>
                    <th>valor</th>
                </tr>
            </thead>

            <tbody id="tablaProductos"></tbody>
        </table>

    </div>

    <!-- VENTAS -->
    <div id="ventas" class="card p-4 shadow caja oculto">
        <h3>Gestión de Ventas</h3>
        <p>En construcción...</p>
    </div>

</div>

<script src="../js/script.js"></script>
<script src="../js/script_crud_admin.js"></script>

</body>
</html>
